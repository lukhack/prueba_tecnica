spring:
  application:
    name: triage-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triaje}
    username: ${DB_USER:triaje}
    password: ${DB_PASSWORD:triaje}
    pool:
      initial-size: 5
      max-size: 20
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triaje}
    user: ${DB_USER:triaje}
    password: ${DB_PASSWORD:triaje}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  reactor:
    context-propagation: auto

server:
  port: ${PORT:8081}

triage:
  sla:
    critico: ${SLA_CRITICO:5m}
    urgente: ${SLA_URGENTE:10m}
    urgente2: ${SLA_URGENTE_2:30m}
    no-urgente: ${SLA_NO_URGENTE:60m}
    no-urgente2: ${SLA_NO_URGENTE_2:120m}
  escalamiento:
    habilitado: ${ESCALAMIENTO_HABILITADO:true}
    intervalo: ${ESCALAMIENTO_INTERVALO:30s}
  eventos:
    topic: triaje.eventos
    particiones: 3
  alertas:
    webhook-url: ${ALERTAS_WEBHOOK_URL:}
    timeout: 3s

seguridad:
  api-key: ${TRIAGE_API_KEY:}

resilience4j:
  circuitbreaker:
    instances:
      alertasWebhook:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.vidacruz: INFO
    org.springframework.r2dbc: INFO
