name: vidacruz-triaje

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triaje
      POSTGRES_USER: triaje
      POSTGRES_PASSWORD: ${DB_PASSWORD:-triaje}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triaje -d triaje"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: vidacruz-triaje-local-000
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  triage-service:
    build:
      context: .
      dockerfile: triage-service/Dockerfile
    image: vidacruz/triage-service:local
    environment:
      DB_HOST: postgres
      DB_NAME: triaje
      DB_USER: triaje
      DB_PASSWORD: ${DB_PASSWORD:-triaje}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRIAGE_API_KEY: ${TRIAGE_API_KEY:?Defina TRIAGE_API_KEY en .env}
      ALERTAS_WEBHOOK_URL: ${ALERTAS_WEBHOOK_URL:-}
      ESCALAMIENTO_INTERVALO: ${ESCALAMIENTO_INTERVALO:-15s}
      SLA_CRITICO: ${SLA_CRITICO:-5m}
      SLA_URGENTE: ${SLA_URGENTE:-10m}
      SLA_URGENTE_2: ${SLA_URGENTE_2:-30m}
      SLA_NO_URGENTE: ${SLA_NO_URGENTE:-60m}
      SLA_NO_URGENTE_2: ${SLA_NO_URGENTE_2:-120m}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  asistente-service:
    build:
      context: .
      dockerfile: asistente-service/Dockerfile
    image: vidacruz/asistente-service:local
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ASISTENTE_API_KEY: ${ASISTENTE_API_KEY:?Defina ASISTENTE_API_KEY en .env}
      LLM_API_KEY: ${LLM_API_KEY:?Defina LLM_API_KEY en .env (nunca se commitea)}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o-mini}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_EMBEDDING_BASE_URL: ${LLM_EMBEDDING_BASE_URL:-${LLM_BASE_URL:-https://api.openai.com}}
      LLM_EMBEDDING_API_KEY: ${LLM_EMBEDDING_API_KEY:-${LLM_API_KEY}}
      RAG_UMBRAL_SIMILITUD: ${RAG_UMBRAL_SIMILITUD:-0.30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/liveness >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  postgres-data:
