name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Compilar, tests unitarios e integración (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (unit + integration)
        run: ./mvnw -B verify

      - name: Publicar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml

  docker-images:
    name: Construir imágenes Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f triage-service/Dockerfile -t vidacruz/triage-service:ci .
      - run: docker build -f asistente-service/Dockerfile -t vidacruz/asistente-service:ci .
