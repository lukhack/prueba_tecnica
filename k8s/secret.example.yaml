# PLANTILLA: no contiene credenciales reales y el Secret real NO se commitea.
# Cree el Secret directamente en el clúster:
#
#   kubectl -n vidacruz create secret generic vidacruz-secrets \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=TRIAGE_API_KEY='...' \
#     --from-literal=ASISTENTE_API_KEY='...' \
#     --from-literal=LLM_API_KEY='...' \
#     --from-literal=ALERTAS_WEBHOOK_URL=''
#
# En producción se recomienda Azure Key Vault + CSI Secrets Store driver en lugar de Secrets planos.
apiVersion: v1
kind: Secret
metadata:
  name: vidacruz-secrets
type: Opaque
stringData:
  DB_PASSWORD: "REEMPLAZAR"
  TRIAGE_API_KEY: "REEMPLAZAR"
  ASISTENTE_API_KEY: "REEMPLAZAR"
  LLM_API_KEY: "REEMPLAZAR"
  ALERTAS_WEBHOOK_URL: ""
