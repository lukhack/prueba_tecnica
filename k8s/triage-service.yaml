apiVersion: v1
kind: Service
metadata:
  name: triage-service
  labels:
    app: triage-service
spec:
  selector:
    app: triage-service
  ports:
    - name: http
      port: 80
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  labels:
    app: triage-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: triage-service
          image: vidacruz/triage-service:local
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: vidacruz-config
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: vidacruz-secrets, key: DB_PASSWORD } }
            - name: TRIAGE_API_KEY
              valueFrom: { secretKeyRef: { name: vidacruz-secrets, key: TRIAGE_API_KEY } }
            - name: ALERTAS_WEBHOOK_URL
              valueFrom: { secretKeyRef: { name: vidacruz-secrets, key: ALERTAS_WEBHOOK_URL, optional: true } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 768Mi }
