# Punto de entrada público (NGINX Ingress Controller o el Application Routing add-on de AKS).
# Las APIs quedan expuestas bajo /triage/** y /asistente/**; la autenticación por X-API-Key la hace cada servicio.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vidacruz
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /triage
            pathType: Prefix
            backend:
              service:
                name: triage-service
                port:
                  number: 80
          - path: /asistente
            pathType: Prefix
            backend:
              service:
                name: asistente-service
                port:
                  number: 80
