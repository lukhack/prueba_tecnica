apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vidacruz

resources:
  - namespace.yaml
  - configmap.yaml
  - infra/postgres.yaml
  - infra/kafka.yaml
  - infra/redis.yaml
  - triage-service.yaml
  - asistente-service.yaml
  - ingress.yaml

images:
  - name: vidacruz/triage-service
    newName: REEMPLAZAR_ACR.azurecr.io/vidacruz/triage-service
    newTag: "1.0.0"
  - name: vidacruz/asistente-service
    newName: REEMPLAZAR_ACR.azurecr.io/vidacruz/asistente-service
    newTag: "1.0.0"
